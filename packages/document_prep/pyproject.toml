[project]
name = "document-prep"
version = "0.1.0"
description = "Render PDF pages and cut table regions, extended over their titles and footnotes"
license = "Apache-2.0"
authors = [{ name = "Lothar Schiemanowski" }]
requires-python = ">=3.12,<3.13"
# pypdfium2 is pinned exactly: crop pixels, and so what the model learns, depend on the renderer.
dependencies = ["numpy>=2.5.4", "pillow>=13.0.0", "pypdfium2==5.15.1"]

[project.optional-dependencies]
# Docling Heron layout detection (text regions that stop crop extension; later also table detection).
# Pinned like the renderer: crops depend on it. Installed with `uv sync --group layout`.
layout = ["torch==2.15.0", "transformers==5.22.1"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
